name: CI
on: [push, pull_request]

jobs:
  yocto-check-layer:
    name: "Check Layer"
    strategy:
      matrix:
        # Yocto versions (using branch convention)
        # https://wiki.yoctoproject.org/wiki/Releases
        branch: ["dunfell"]
    env:
      YOCTO_RELEASE: ${{ matrix.branch }}

    runs-on: ubuntu-latest
    steps:
      - name: Install Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gawk wget git diffstat unzip texinfo gcc \
          build-essential chrpath socat cpio file xz-utils debianutils \
          iputils-ping libegl1 libsdl1.2-dev xterm mesa-common-dev zstd lz4

      # Dunfell's bitbake imports `asyncore`, which was removed in Python 3.12.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install Python dependencies
        run: pip install GitPython jinja2 pexpect python-subunit pylint

      - name: Check out meta-fossa
        uses: actions/checkout@v3

      - name: Run Yocto check layer script
        run: |
          cd ${RUNNER_TEMP}
          git clone --depth 1 --branch ${YOCTO_RELEASE} https://git.yoctoproject.org/git/poky 
          source ./poky/oe-init-build-env build
          yocto-check-layer --with-software-layer-signature-check --debug "$GITHUB_WORKSPACE"

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".markdown-link-check.json"

      - name: Disallow empty Markdown links
        run: |
          ! grep ']()' **/*.md

  common-verbiage-check:
    name: "Check for correct spelling of FOSSA"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: "Check for incorrect FOSSA wording"
        run: |
          ! grep 'Fossa ' **/*.md
